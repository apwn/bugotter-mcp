name: unpack brand assets
on:
  push:
    paths:
      - ".github/workflows/unpack-brand-assets.yml"
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch brand PNGs and drop this workflow
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -fsSL "https://h.uguu.se/OMQmZWYGnoKw.png" -o assets/icon-512.png
          curl -fsSL "https://d.uguu.se/pTmUzuJgBPxZ.png" -o assets/logo.png
          echo "d864d79abb809736e51ecfee259da285e5a925942ae890a6840507a517cc67fb  assets/icon-512.png" | sha256sum -c
          echo "5eeadf786eef2d7e7b466d807df609d7d3e16b959b356bc27fdde18bf09f3892  assets/logo.png" | sha256sum -c
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icon-512.png assets/logo.png
          git rm -f .github/workflows/unpack-brand-assets.yml
          git commit -m "Add brand icon and logo"
          git push
